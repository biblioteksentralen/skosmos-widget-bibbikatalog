name: Check

on:
  push:

jobs:
  check:
    name: Type-check widget.js
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # Checks widget.js against the BMDB API types from @biblioteksentralen/bmdb-search
      - run: npm ci
      - run: npm run check
